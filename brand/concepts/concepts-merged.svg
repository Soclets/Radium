<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300">
  <title>Radium logo concepts: the rising line merged into the R's head</title>
  <rect width="560" height="300" fill="#0b1510"/>

  <!-- E: the rising line closes up against the head, so the two strokes merge into one thicker band -->
  <g transform="translate(20,20)" fill="none" stroke="#5de08a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="240" height="240" rx="28" fill="#0f1f17" stroke="none"/>
    <path d="M56 66 V206"/>
    <path d="M56 76 H100 A32 32 0 0 1 100 140 H56"/>
    <path d="M84 140 L142 206 V108 A42 42 0 0 0 100 66 H56"/>
  </g>
  <text x="140" y="285" fill="#9fe8b6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">E: merged, thicker head</text>

  <!-- F: the rising line becomes the head's own right side, so nothing is doubled -->
  <g transform="translate(300,20)" fill="none" stroke="#5de08a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="240" height="240" rx="28" fill="#0f1f17" stroke="none"/>
    <path d="M56 206 V76 H100 A32 32 0 0 1 132 108 V206"/>
    <path d="M132 108 A32 32 0 0 1 100 140 H56"/>
    <path d="M84 140 L132 206"/>
  </g>
  <text x="420" y="285" fill="#9fe8b6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">F: merged, same thickness</text>
</svg>
